<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1118">
<meta name="description" content="90초 안에 육각 블록을 채워 라인을 터뜨리는 퍼즐 게임">
<title>honeycomb-pang</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍯</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-block">
      <span class="hud-label">SCORE</span>
      <strong id="score">0</strong>
    </div>
    <div class="hud-block hud-timer">
      <span class="hud-label">TIME</span>
      <strong id="time">90.0</strong>
      <div class="timer-bar"><i id="timer-fill"></i></div>
    </div>
    <button id="btn-labels" type="button" class="chip" aria-pressed="false">좌표</button>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
  </main>

  <footer id="controls">
    <button id="btn-refresh" type="button" class="btn">
      새로 뽑기 <span class="cost">−1초</span>
    </button>
  </footer>

  <div id="overlay" class="show">
    <div class="panel">
      <h1>honeycomb<span>-pang</span></h1>
      <p class="tagline">90초. 벌집을 채우고 라인을 터뜨려라.</p>
      <ul class="rules">
        <li>블록을 끌어다 벌집에 놓으면 <b>타일당 20점</b></li>
        <li>한 줄이 <b>가득 차면</b> 통째로 사라지고 <b>타일당 100점</b></li>
        <li>가로 · ↗ · ↘ 세 방향, 두 줄이 겹치면 중복으로 가산</li>
        <li><b class="gold">×2 보너스 블록</b>은 놓을 때도 터질 때도 <b>2배</b></li>
      </ul>
      <button id="btn-start" type="button" class="btn btn-primary">시작</button>
      <p class="best">최고 점수 <b id="best">0</b></p>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
